<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Journey — Clip-Path Slider</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ─── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #0a0a0f;
      --blue:    #00d4ff;
      --gold:    #ffd700;
      --white:   #f0f0f5;
      --dim:     rgba(240,240,245,.45);
      --dur:     1.1s;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      color: var(--white);
    }

    /* ─── Grain overlay ──────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      animation: grainShift 0.8s steps(1) infinite;
    }
    @keyframes grainShift {
      0%  { background-position:   0px   0px; }
      10% { background-position: -50px -80px; }
      20% { background-position:  70px  30px; }
      30% { background-position: -20px  60px; }
      40% { background-position:  30px -40px; }
      50% { background-position: -80px  20px; }
      60% { background-position:  60px  80px; }
      70% { background-position: -30px -60px; }
      80% { background-position:  80px  40px; }
      90% { background-position: -60px  10px; }
    }

    /* ─── Slider shell ───────────────────────────────────────── */
    #slider {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }

    /* ─── Slide ──────────────────────────────────────────────── */
    .slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* Three layered panels per slide */
    .slide-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      will-change: clip-path;
    }

    .slide-layer img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Colour-tinted duplicate layers */
    .slide-layer:nth-child(2) img { filter: hue-rotate(15deg) saturate(1.1); }
    .slide-layer:nth-child(3) img { filter: hue-rotate(-15deg) saturate(.9) brightness(.85); }

    /* Dark vignette gradient over the image */
    .slide-vignette {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, transparent 40%, rgba(10,10,15,.75) 100%),
        linear-gradient(to top, rgba(10,10,15,.85) 0%, transparent 55%),
        linear-gradient(to right, rgba(10,10,15,.5) 0%, transparent 40%);
      pointer-events: none;
      z-index: 10;
    }

    /* ─── Slide text ─────────────────────────────────────────── */
    .slide-text {
      position: absolute;
      bottom: 13vh;
      left: 8vw;
      z-index: 20;
      pointer-events: none;
    }

    .slide-year {
      font-size: clamp(3.5rem, 7vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      color: var(--gold);
      letter-spacing: -.02em;
      opacity: 0;
      transform: translateY(28px);
      /* animation driven by JS */
    }

    .slide-role {
      font-size: clamp(.85rem, 1.6vw, 1.35rem);
      font-weight: 300;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--white);
      margin-top: .45em;
      opacity: 0;
      transform: translateY(18px);
    }

    .slide-company {
      font-size: clamp(1.4rem, 2.8vw, 2.4rem);
      font-weight: 600;
      color: var(--blue);
      margin-top: .15em;
      letter-spacing: .02em;
      opacity: 0;
      transform: translateY(18px);
    }

    /* vertical accent line */
    .slide-line {
      position: absolute;
      left: -2.2rem;
      top: .3em;
      width: 2px;
      height: 0;
      background: linear-gradient(to bottom, var(--gold), var(--blue));
    }

    /* ─── Progress bar ───────────────────────────────────────── */
    #progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--blue));
      z-index: 500;
      transition: none;
    }

    /* ─── Navigation arrows ──────────────────────────────────── */
    .nav-arrow {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      z-index: 300;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,212,255,.35);
      background: rgba(10,10,15,.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: border-color .3s, background .3s, transform .3s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-arrow:hover {
      border-color: var(--blue);
      background: rgba(0,212,255,.1);
      transform: translateY(-50%) scale(1.08);
    }
    #nav-prev { left: 3vw; }
    #nav-next { right: 3vw; }

    /* Luxury thin-line arrow icon */
    .nav-arrow svg {
      width: 22px; height: 22px;
      stroke: var(--blue);
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .3s;
    }

    /* ─── Dot indicators ─────────────────────────────────────── */
    #dots {
      position: fixed;
      bottom: 4vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(240,240,245,.3);
      cursor: pointer;
      transition: background .35s, transform .35s, width .35s;
      position: relative;
    }
    .dot.active {
      background: var(--blue);
      transform: scale(1.4);
      box-shadow: 0 0 10px var(--blue);
    }

    /* ─── Slide counter ──────────────────────────────────────── */
    #counter {
      position: fixed;
      top: 50%;
      right: 3vw;
      transform: translateY(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: .7rem;
      letter-spacing: .15em;
      color: var(--dim);
    }
    #counter-current {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--blue);
      line-height: 1;
    }
    #counter-sep {
      width: 1px;
      height: 28px;
      background: rgba(0,212,255,.25);
    }
    #counter-total {
      font-size: .75rem;
      color: var(--dim);
    }

    /* ─── Corner label ───────────────────────────────────────── */
    #corner-label {
      position: fixed;
      top: 4vh;
      left: 8vw;
      z-index: 300;
      font-size: .65rem;
      font-weight: 500;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--dim);
    }
    #corner-label span {
      color: var(--blue);
    }

    /* ─── Blue scanline accent ───────────────────────────────── */
    #scanline {
      position: fixed;
      left: 0; right: 0;
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--blue) 50%, transparent 100%);
      opacity: 0;
      z-index: 400;
      pointer-events: none;
    }

  </style>
</head>
<body>

  <!-- Top progress bar -->
  <div id="progress-bar"></div>

  <!-- Scanline flash effect -->
  <div id="scanline"></div>

  <!-- Corner label -->
  <div id="corner-label">Career <span>Journey</span></div>

  <!-- Slide counter (right side) -->
  <div id="counter">
    <span id="counter-current">01</span>
    <div id="counter-sep"></div>
    <span id="counter-total">05</span>
    <span style="margin-top:4px;">SLIDE</span>
  </div>

  <!-- Main slider -->
  <div id="slider"></div>

  <!-- Navigation arrows -->
  <button class="nav-arrow" id="nav-prev" aria-label="Previous">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button class="nav-arrow" id="nav-next" aria-label="Next">
    <svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>
  </button>

  <!-- Dot indicators -->
  <div id="dots"></div>

  <script>
  (() => {
    'use strict';

    /* ─── Data ─────────────────────────────────────────────────── */
    const slides = [
      { img: 'assets/images/1.png', year: '2010', role: 'Automation Engineer', company: 'NPF Inkram' },
      { img: 'assets/images/2.png', year: '2013', role: 'Chief Technologist',  company: 'Gazprom'    },
      { img: 'assets/images/3.png', year: '2019', role: 'Gas Engineer',        company: 'Nord Stream 2' },
      { img: 'assets/images/4.png', year: '2022', role: 'Project Manager',     company: 'Belimed'    },
      { img: 'assets/images/5.png', year: '2026', role: 'AI / Data Lead',      company: 'Belimed'    },
    ];

    const N = slides.length;

    /* ─── Clip-path shape generators ──────────────────────────── */

    // Full-cover diamond (45° rotated square that covers the viewport)
    const diamondFull  = 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
    // Collapsed diamond at center (zero area)
    const diamondZero  = 'polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%)';

    // Full circle reveal (large enough to cover corners)
    const circleFull   = 'circle(150% at 50% 50%)';
    const circleZero   = 'circle(0% at 50% 50%)';

    // Starburst / hexagon expand
    function hexPoly(pct) {
      const r = pct;        // 0→0 … 150→covers all
      const cx = 50, cy = 50;
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const rx = cx + r * Math.cos(angle);
        const ry = cy + r * Math.sin(angle);
        pts.push(`${rx.toFixed(2)}% ${ry.toFixed(2)}%`);
      }
      return `polygon(${pts.join(', ')})`;
    }

    // Cross / plus expand (8-point polygon)
    function crossPoly(pct) {
      const a = Math.max(0, pct * 0.35);   // arm width half
      const b = pct;                        // arm reach
      const cx = 50, cy = 50;
      // 12-point cross
      const pts = [
        [cx - a, cy - b], [cx + a, cy - b],
        [cx + a, cy - a], [cx + b, cy - a],
        [cx + b, cy + a], [cx + a, cy + a],
        [cx + a, cy + b], [cx - a, cy + b],
        [cx - a, cy + a], [cx - b, cy + a],
        [cx - b, cy - a], [cx - a, cy - a],
      ];
      return `polygon(${pts.map(([x,y]) => `${x.toFixed(2)}% ${y.toFixed(2)}%`).join(', ')})`;
    }

    // Diamond (iris) shrink points
    function diamondPoly(pct) {
      const r = pct;
      const cx = 50, cy = 50;
      return `polygon(${cx}% ${cy - r}%, ${cx + r}% ${cy}%, ${cx}% ${cy + r}%, ${cx - r}% ${cy}%)`;
    }

    /* ─── Build DOM ────────────────────────────────────────────── */
    const slider   = document.getElementById('slider');
    const dotsWrap = document.getElementById('dots');
    const progressBar = document.getElementById('progress-bar');
    const counterCur  = document.getElementById('counter-current');
    const scanline    = document.getElementById('scanline');

    const slideEls = [];
    const layerEls = [];  // [slideIdx][layerIdx (0-2)]
    const textEls  = [];  // { year, role, company, line }
    const dotEls   = [];

    slides.forEach((data, i) => {
      // Slide wrapper
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.style.zIndex = 1;

      // Three image layers
      const layers = [];
      for (let l = 0; l < 3; l++) {
        const layer = document.createElement('div');
        layer.className = 'slide-layer';
        layer.style.clipPath = circleZero;

        const img = document.createElement('img');
        img.src = data.img;
        img.alt = `${data.year} — ${data.role}`;
        img.draggable = false;
        layer.appendChild(img);
        slide.appendChild(layer);
        layers.push(layer);
      }

      // Vignette
      const vig = document.createElement('div');
      vig.className = 'slide-vignette';
      slide.appendChild(vig);

      // Text block
      const textBlock = document.createElement('div');
      textBlock.className = 'slide-text';

      const line = document.createElement('div');
      line.className = 'slide-line';

      const yearEl = document.createElement('div');
      yearEl.className = 'slide-year';
      yearEl.textContent = data.year;

      const roleEl = document.createElement('div');
      roleEl.className = 'slide-role';
      roleEl.textContent = data.role;

      const compEl = document.createElement('div');
      compEl.className = 'slide-company';
      compEl.textContent = data.company;

      textBlock.appendChild(line);
      textBlock.appendChild(yearEl);
      textBlock.appendChild(roleEl);
      textBlock.appendChild(compEl);
      slide.appendChild(textBlock);

      slider.appendChild(slide);
      slideEls.push(slide);
      layerEls.push(layers);
      textEls.push({ year: yearEl, role: roleEl, company: compEl, line });

      // Dot
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
      dotEls.push(dot);
    });

    /* ─── State ────────────────────────────────────────────────── */
    let current   = 0;
    let busy      = false;
    let autoTimer = null;
    let progTween = null;

    /* ─── Helpers ──────────────────────────────────────────────── */
    function pad(n) { return String(n + 1).padStart(2, '0'); }

    function setDots(idx) {
      dotEls.forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    function setCounter(idx) {
      counterCur.textContent = pad(idx);
    }

    /* ─── Text animations ──────────────────────────────────────── */
    function hideText(idx) {
      const { year, role, company, line } = textEls[idx];
      gsap.to([year, role, company], {
        opacity: 0, y: -20, duration: .4, stagger: .07, ease: 'power2.in'
      });
      gsap.to(line, { height: 0, duration: .3, ease: 'power2.in' });
    }

    function showText(idx) {
      const { year, role, company, line } = textEls[idx];
      gsap.fromTo(year,    { opacity: 0, y: 32 }, { opacity: 1, y: 0, duration: .75, delay: .55, ease: 'power3.out' });
      gsap.fromTo(role,    { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .65, delay: .70, ease: 'power3.out' });
      gsap.fromTo(company, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .65, delay: .80, ease: 'power3.out' });
      gsap.fromTo(line,    { height: 0 },          { height: '3.8em', duration: .5, delay: .5, ease: 'power2.out' });
    }

    /* ─── Scanline flash ───────────────────────────────────────── */
    function flashScanline() {
      gsap.fromTo(scanline,
        { opacity: .55, scaleX: 0 },
        { opacity: 0,   scaleX: 1, duration: .55, ease: 'power2.out' }
      );
    }

    /* ─── Progress bar ─────────────────────────────────────────── */
    function startProgress(duration) {
      if (progTween) progTween.kill();
      gsap.set(progressBar, { width: '0%' });
      progTween = gsap.to(progressBar, {
        width: '100%',
        duration: duration / 1000,
        ease: 'none',
      });
    }

    function pauseProgress() { if (progTween) progTween.pause(); }
    function resumeProgress() { if (progTween) progTween.resume(); }

    /* ─── Core transition ──────────────────────────────────────── */
    function goTo(next, direction) {
      if (busy || next === current) return;
      busy = true;

      const prev    = current;
      current       = next;
      const layers  = layerEls[next];
      const prevLayers = layerEls[prev];
      direction = direction ?? (next > prev ? 1 : -1);

      // Update UI
      setDots(next);
      setCounter(next);

      // Bring next slide above
      slideEls[next].style.zIndex = 3;
      slideEls[prev].style.zIndex = 2;

      // Hide old text
      hideText(prev);

      // Scanline flash
      flashScanline();

      // ── Entry animation for next slide layers ──────────────────
      // Layer 0: cross/plus expand (fastest)
      // Layer 1: hex expand (slight delay)
      // Layer 2: circle expand (slowest, "fills in" solid)

      const shapes = [
        { from: crossPoly(0),  mid: crossPoly(80), to: circleFull, dur: 0.75, delay: 0      },
        { from: hexPoly(0),    mid: hexPoly(90),   to: circleFull, dur: 0.80, delay: 0.07   },
        { from: circleZero,    mid: null,           to: circleFull, dur: 0.85, delay: 0.14   },
      ];

      shapes.forEach(({ from, mid, to, dur, delay }, li) => {
        const el = layers[li];
        // Reset
        gsap.set(el, { clipPath: from });

        const tl = gsap.timeline({ delay });
        if (mid) {
          tl.to(el, {
            clipPath: mid,
            duration: dur * 0.55,
            ease: 'power2.in',
          }).to(el, {
            clipPath: to,
            duration: dur * 0.55,
            ease: 'power3.out',
          });
        } else {
          tl.to(el, {
            clipPath: to,
            duration: dur,
            ease: 'power3.out',
          });
        }
      });

      // ── Exit animation for prev slide layers ───────────────────
      // Diamond iris contracts inward after the entry is almost done
      [0, 1, 2].forEach((li) => {
        const el = prevLayers[li];
        const startDelay = 0.55 + li * 0.06;
        gsap.fromTo(el,
          { clipPath: circleFull },
          {
            clipPath: diamondZero,
            duration: 0.65,
            delay: startDelay,
            ease: 'power3.in',
            onComplete: li === 2 ? () => {
              // Reset prev slide completely when done
              gsap.set(prevLayers, { clipPath: circleZero });
              slideEls[prev].style.zIndex = 1;
              showText(next);
              busy = false;
            } : undefined,
          }
        );
      });
    }

    /* ─── Auto advance ─────────────────────────────────────────── */
    const AUTO_MS = 5000;

    function scheduleAuto() {
      clearTimeout(autoTimer);
      autoTimer = setTimeout(() => {
        goTo((current + 1) % N, 1);
        scheduleAuto();
        startProgress(AUTO_MS);
      }, AUTO_MS);
    }

    /* ─── Init first slide ─────────────────────────────────────── */
    function initFirst() {
      const layers = layerEls[0];

      slideEls[0].style.zIndex = 3;
      setDots(0);
      setCounter(0);

      // Animate in layers
      [0, 1, 2].forEach((li) => {
        gsap.set(layers[li], { clipPath: circleZero });
        gsap.to(layers[li], {
          clipPath: circleFull,
          duration: 1.1 + li * 0.1,
          delay: li * 0.12,
          ease: 'power3.out',
        });
      });

      showText(0);
      scheduleAuto();
      startProgress(AUTO_MS);
    }

    /* ─── Event listeners ──────────────────────────────────────── */
    document.getElementById('nav-prev').addEventListener('click', () => {
      const next = (current - 1 + N) % N;
      goTo(next, -1);
      scheduleAuto();
      startProgress(AUTO_MS);
    });

    document.getElementById('nav-next').addEventListener('click', () => {
      const next = (current + 1) % N;
      goTo(next, 1);
      scheduleAuto();
      startProgress(AUTO_MS);
    });

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  { goTo((current - 1 + N) % N, -1); scheduleAuto(); startProgress(AUTO_MS); }
      if (e.key === 'ArrowRight') { goTo((current + 1) % N, 1);      scheduleAuto(); startProgress(AUTO_MS); }
    });

    // Pause on hover
    slider.addEventListener('mouseenter', () => { clearTimeout(autoTimer); pauseProgress(); });
    slider.addEventListener('mouseleave', () => { scheduleAuto(); resumeProgress(); });

    // Touch / swipe
    let touchX = null;
    slider.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    slider.addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) {
        const dir = dx < 0 ? 1 : -1;
        goTo((current + dir + N) % N, dir);
        scheduleAuto();
        startProgress(AUTO_MS);
      }
      touchX = null;
    }, { passive: true });

    /* ─── Boot ─────────────────────────────────────────────────── */
    initFirst();
  })();
  </script>
</body>
</html>
