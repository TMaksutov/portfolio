<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Journey – 3D Card Stack</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #04050d;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    /* ─── Star field ───────────────────────────────────────────────────────── */
    #stars-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Scene wrapper ────────────────────────────────────────────────────── */
    #scene {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      z-index: 1;
    }

    /* ─── Header label ─────────────────────────────────────────────────────── */
    .scene-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      user-select: none;
    }

    /* ─── Stage – perspective container ───────────────────────────────────── */
    #stage {
      position: relative;
      width: 520px;
      height: 340px;
      perspective: 1200px;
    }

    /* ─── Individual cards ─────────────────────────────────────────────────── */
    .card {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      overflow: hidden;
      transform-style: preserve-3d;
      cursor: pointer;
      user-select: none;
      /* will be set via JS/GSAP */
      transform-origin: center center;
      backface-visibility: hidden;
    }

    .card-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      border-radius: 20px;
    }

    /* subtle vignette */
    .card-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(4,5,13,0.55) 100%);
      border-radius: 20px;
    }

    /* ─── Glassmorphism panel ──────────────────────────────────────────────── */
    .card-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 22px 28px 24px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.13);
      border-radius: 0 0 20px 20px;
    }

    .card-year {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #f5c842 0%, #f97316 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      display: block;
    }

    .card-role {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,255,255,0.92);
      letter-spacing: 0.3px;
      margin-bottom: 3px;
    }

    .card-company {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ─── Card glow overlay (controlled by JS) ─────────────────────────────── */
    .card-glow {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at 30% 30%, rgba(249,180,20,0.12), transparent 70%);
      transition: opacity 0.3s ease;
    }

    /* ─── Navigation dots ──────────────────────────────────────────────────── */
    #dots {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: background 0.35s ease, transform 0.35s ease, width 0.35s ease;
    }
    .dot.active {
      background: linear-gradient(135deg, #f5c842, #f97316);
      width: 22px;
      border-radius: 3px;
    }
    .dot:hover:not(.active) {
      background: rgba(255,255,255,0.45);
      transform: scale(1.3);
    }

    /* ─── Arrow buttons ────────────────────────────────────────────────────── */
    #arrows {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .arrow-btn {
      pointer-events: all;
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
      color: rgba(255,255,255,0.7);
    }
    .arrow-btn:hover {
      background: rgba(245,200,66,0.12);
      border-color: rgba(245,200,66,0.4);
      color: #f5c842;
      transform: scale(1.08);
    }
    .arrow-btn svg { width: 18px; height: 18px; }

    /* ─── Nav wrapper ──────────────────────────────────────────────────────── */
    #nav-wrapper {
      position: relative;
      width: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Progress bar ─────────────────────────────────────────────────────── */
    #progress-bar-wrap {
      position: absolute;
      bottom: -28px;
      left: 0; right: 0;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 1px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f5c842, #f97316);
      border-radius: 1px;
    }

    /* ─── Slide counter ────────────────────────────────────────────────────── */
    .counter {
      position: absolute;
      top: -44px;
      right: 0;
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
    }
    .counter span { color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>

<!-- Star canvas -->
<canvas id="stars-canvas"></canvas>

<!-- Main scene -->
<div id="scene">
  <p class="scene-label">Career Journey</p>

  <!-- Card stage -->
  <div id="stage">
    <!-- Cards injected by JS -->
  </div>

  <!-- Nav row -->
  <div id="nav-wrapper">
    <span class="counter"><span id="count-current">1</span> / <span id="count-total">5</span></span>

    <div id="arrows">
      <button class="arrow-btn" id="btn-prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button class="arrow-btn" id="btn-next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div id="dots"></div>

    <div id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   DATA
══════════════════════════════════════════════════════════════════════════ */
const slides = [
  { img: 'assets/images/1.png', year: '2010', role: 'Automation System Engineer', company: 'NPF Inkram' },
  { img: 'assets/images/2.png', year: '2013', role: 'Chief Technologist',         company: 'Gazprom'    },
  { img: 'assets/images/3.png', year: '2019', role: 'Gas Engineer',               company: 'Nord Stream 2' },
  { img: 'assets/images/4.png', year: '2022', role: 'Project Manager',            company: 'Belimed'    },
  { img: 'assets/images/5.png', year: '2026', role: 'AI & Data Lead',             company: 'Belimed'    },
];
const TOTAL = slides.length;

/* ══════════════════════════════════════════════════════════════════════════
   STAR FIELD
══════════════════════════════════════════════════════════════════════════ */
(function initStars() {
  const canvas = document.getElementById('stars-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, stars;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function createStars(n) {
    stars = Array.from({ length: n }, () => ({
      x:    Math.random() * W,
      y:    Math.random() * H,
      r:    Math.random() * 1.1 + 0.2,
      a:    Math.random(),
      da:   (Math.random() * 0.003 + 0.001) * (Math.random() < 0.5 ? 1 : -1),
      speed: Math.random() * 0.04 + 0.005,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.a += s.da;
      if (s.a <= 0 || s.a >= 1) s.da *= -1;
      s.y -= s.speed;
      if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a.toFixed(3)})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  resize();
  createStars(220);
  draw();
  window.addEventListener('resize', () => { resize(); createStars(220); });
})();


/* ══════════════════════════════════════════════════════════════════════════
   CARD CAROUSEL
══════════════════════════════════════════════════════════════════════════ */
const stage    = document.getElementById('stage');
const dotsEl   = document.getElementById('dots');
const btnNext  = document.getElementById('btn-next');
const btnPrev  = document.getElementById('btn-prev');
const progBar  = document.getElementById('progress-bar');
const cntCur   = document.getElementById('count-current');

let current   = 0;
let animating = false;

/* ── Card state definitions ─────────────────────────────────────────────── */
// positions relative to deck:  -2  -1  [0=active]  +1  +2
const STATES = {
  active:   { x:   0, z:  0,   rotY:   0, scale: 1,    opacity: 1,    zIndex: 10 },
  prev1:    { x: -80, z: -80,  rotY:  18, scale: 0.88, opacity: 0.75, zIndex: 7  },
  next1:    { x:  80, z: -80,  rotY: -18, scale: 0.88, opacity: 0.75, zIndex: 7  },
  prev2:    { x:-130, z:-160,  rotY:  28, scale: 0.76, opacity: 0.4,  zIndex: 4  },
  next2:    { x: 130, z:-160,  rotY: -28, scale: 0.76, opacity: 0.4,  zIndex: 4  },
  hidden:   { x:   0, z:-300,  rotY:   0, scale: 0.6,  opacity: 0,    zIndex: 1  },
};

/* ── Build card elements ─────────────────────────────────────────────────── */
const cardEls = slides.map((s, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-img" style="background-image:url('${s.img}')"></div>
    <div class="card-glow"></div>
    <div class="card-panel">
      <span class="card-year">${s.year}</span>
      <div class="card-role">${s.role}</div>
      <div class="card-company">${s.company}</div>
    </div>
  `;
  stage.appendChild(card);
  return card;
});

/* ── Dots ───────────────────────────────────────────────────────────────── */
const dotEls = slides.map((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
  return d;
});

function updateDots(idx) {
  dotEls.forEach((d, i) => d.classList.toggle('active', i === idx));
  cntCur.textContent = idx + 1;
}

/* ── Apply state instantly (no animation) ───────────────────────────────── */
function getState(cardIdx, activeIdx) {
  const diff = cardIdx - activeIdx;
  if (diff === 0)  return STATES.active;
  if (diff === -1) return STATES.prev1;
  if (diff ===  1) return STATES.next1;
  if (diff === -2) return STATES.prev2;
  if (diff ===  2) return STATES.next2;
  return STATES.hidden;
}

function applyInstant(cardEl, state) {
  gsap.set(cardEl, {
    x:        state.x,
    z:        state.z,
    rotateY:  state.rotY,
    scale:    state.scale,
    opacity:  state.opacity,
    zIndex:   state.zIndex,
  });
  cardEl.style.pointerEvents = (state === STATES.active) ? 'all' : 'none';
}

/* ── Initial layout ─────────────────────────────────────────────────────── */
cardEls.forEach((el, i) => applyInstant(el, getState(i, current)));
updateDots(current);
updateBoxShadow(cardEls[current], 0, 0);

/* ── Navigate ───────────────────────────────────────────────────────────── */
function navigate(dir) {
  if (animating) return;
  const next = (current + dir + TOTAL) % TOTAL;
  animating = true;

  const prevActive = current;
  const nextActive = next;
  current = next;

  const DURATION = 0.68;
  const EASE     = 'power3.inOut';

  cardEls.forEach((el, i) => {
    const fromState = getState(i, prevActive);
    const toState   = getState(i, nextActive);

    // Special dramatic exit for the leaving active card
    if (i === prevActive) {
      const exitX = dir > 0 ? -340 : 340;
      gsap.to(el, {
        x:       exitX,
        z:       -200,
        rotateY: dir > 0 ? 35 : -35,
        scale:   0.55,
        opacity: 0,
        duration: DURATION,
        ease:     EASE,
        zIndex:   toState.zIndex,
      });
    }
    // New active card comes from the side
    else if (i === nextActive) {
      const entryX = dir > 0 ? 340 : -340;
      gsap.fromTo(el,
        { x: entryX, z: -100, rotateY: dir > 0 ? -30 : 30, scale: 0.7, opacity: 0.1, zIndex: 9 },
        { x: 0, z: 0, rotateY: 0, scale: 1, opacity: 1, zIndex: 10,
          duration: DURATION, ease: EASE,
          onComplete: () => {
            animating = false;
            updateBoxShadow(el, 0, 0);
            el.style.pointerEvents = 'all';
          }
        }
      );
    }
    // All other cards smoothly shuffle
    else {
      gsap.to(el, {
        x:       toState.x,
        z:       toState.z,
        rotateY: toState.rotY,
        scale:   toState.scale,
        opacity: toState.opacity,
        zIndex:  toState.zIndex,
        duration: DURATION,
        ease:     EASE,
      });
      el.style.pointerEvents = 'none';
    }
  });

  updateDots(nextActive);
  restartProgress();
}

btnNext.addEventListener('click', () => navigate(1));
btnPrev.addEventListener('click', () => navigate(-1));

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft')  navigate(-1);
});

function goTo(idx) {
  if (idx === current || animating) return;
  navigate(idx > current ? 1 : -1);
  // For jumps > 1 step, chain them — but keep it simple for now
}

/* ── Box-shadow depth effect ─────────────────────────────────────────────── */
function updateBoxShadow(el, tiltX, tiltY) {
  const shadowX = tiltY *  2.5;
  const shadowY = tiltX *  2.5;
  const depth1  = `${shadowX}px ${shadowY + 18}px 50px rgba(0,0,0,0.55)`;
  const depth2  = `${shadowX * 0.5}px ${shadowY + 40}px 80px rgba(0,0,0,0.35)`;
  const glow    = `0 0 60px rgba(245,180,40,0.08)`;
  el.style.boxShadow = `${depth1}, ${depth2}, ${glow}`;
}

/* ── Mouse parallax on active card ─────────────────────────────────────── */
const MAX_TILT = 10; // degrees

stage.addEventListener('mousemove', e => {
  const activeEl = cardEls[current];
  if (!activeEl) return;

  const rect = stage.getBoundingClientRect();
  const cx   = rect.left + rect.width  / 2;
  const cy   = rect.top  + rect.height / 2;
  const dx   = (e.clientX - cx) / (rect.width  / 2);   // -1 to 1
  const dy   = (e.clientY - cy) / (rect.height / 2);   // -1 to 1

  const tiltX = -dy * MAX_TILT;
  const tiltY =  dx * MAX_TILT;

  gsap.to(activeEl, {
    rotateX:  tiltX,
    rotateY:  tiltY,
    duration: 0.5,
    ease:     'power2.out',
  });

  // Update glow
  const glow = activeEl.querySelector('.card-glow');
  if (glow) {
    const gx = 50 + dx * 30;
    const gy = 50 + dy * 30;
    glow.style.background = `radial-gradient(ellipse at ${gx}% ${gy}%, rgba(249,180,20,0.18), transparent 65%)`;
    glow.style.opacity = '1';
  }

  updateBoxShadow(activeEl, tiltX, tiltY);
});

stage.addEventListener('mouseleave', () => {
  const activeEl = cardEls[current];
  if (!activeEl) return;
  gsap.to(activeEl, { rotateX: 0, rotateY: 0, duration: 0.7, ease: 'elastic.out(1, 0.5)' });
  const glow = activeEl.querySelector('.card-glow');
  if (glow) glow.style.opacity = '0';
  updateBoxShadow(activeEl, 0, 0);
});

/* ── Touch / swipe support ──────────────────────────────────────────────── */
let touchStartX = null;
stage.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend',   e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) navigate(dx < 0 ? 1 : -1);
  touchStartX = null;
});

/* ── Auto-advance with progress bar ─────────────────────────────────────── */
const AUTO_INTERVAL = 5500;
let autoTimer    = null;
let progressTween = null;

function startProgress() {
  progBar.style.transition = 'none';
  progBar.style.width = '0%';
  void progBar.offsetWidth; // reflow
  progBar.style.transition = `width ${AUTO_INTERVAL}ms linear`;
  progBar.style.width = '100%';
}

function stopProgress() {
  progBar.style.transition = 'none';
  progBar.style.width = '0%';
}

function restartProgress() {
  stopProgress();
  clearInterval(autoTimer);
  setTimeout(() => {
    startProgress();
    autoTimer = setInterval(() => navigate(1), AUTO_INTERVAL);
  }, 50);
}

restartProgress();

// Pause on hover
stage.addEventListener('mouseenter', () => {
  clearInterval(autoTimer);
  stopProgress();
});
stage.addEventListener('mouseleave', () => {
  restartProgress();
});

/* ── Entrance animation ──────────────────────────────────────────────────── */
gsap.from(cardEls, {
  opacity:  0,
  y:        60,
  scale:    0.85,
  duration: 0.9,
  ease:     'power3.out',
  stagger:  0.1,
  delay:    0.2,
});
gsap.from('#dots, #arrows, .scene-label, .counter', {
  opacity:  0,
  y:        20,
  duration: 0.7,
  ease:     'power2.out',
  stagger:  0.08,
  delay:    0.5,
});
</script>
</body>
</html>
