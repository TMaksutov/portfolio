<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Journey – Film Strip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080810;
      --cream: #f5f0e8;
      --white: #ffffff;
      --duration: 800ms;
      --ease: cubic-bezier(0.77, 0, 0.175, 1);
      --active-scale: 1;
      --idle-scale: 0.92;
      --idle-blur: 3px;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      user-select: none;
      cursor: default;
    }

    /* ──────────────── SVG FILM GRAIN FILTER ──────────────── */
    .grain-svg {
      position: fixed;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    /* ──────────────── GRAIN OVERLAY ──────────────── */
    .grain-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0.055;
      filter: url(#grain);
      background: transparent;
      width: 100%;
      height: 100%;
      /* animate grain position for dynamic noise */
      animation: grainShift 0.08s steps(1) infinite;
    }

    @keyframes grainShift {
      0%   { transform: translate(0, 0); }
      10%  { transform: translate(-3px, 2px); }
      20%  { transform: translate(2px, -3px); }
      30%  { transform: translate(-1px, 4px); }
      40%  { transform: translate(3px, -1px); }
      50%  { transform: translate(-2px, -2px); }
      60%  { transform: translate(4px, 1px); }
      70%  { transform: translate(-1px, -3px); }
      80%  { transform: translate(2px, 3px); }
      90%  { transform: translate(-4px, 0px); }
      100% { transform: translate(1px, -4px); }
    }

    /* ──────────────── PROGRESS BAR ──────────────── */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, rgba(245,240,232,0.3), rgba(245,240,232,0.9), rgba(245,240,232,0.3));
      z-index: 200;
      transition: width linear;
      box-shadow: 0 0 8px rgba(245,240,232,0.4);
    }

    /* ──────────────── FILMSTRIP VIEWPORT ──────────────── */
    .filmstrip-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .filmstrip-track {
      display: flex;
      height: 100%;
      width: 500vw; /* 5 slides × 100vw */
      transition: transform var(--duration) var(--ease);
      will-change: transform;
    }

    /* ──────────────── SLIDE ──────────────── */
    .slide {
      position: relative;
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      overflow: hidden;
    }

    .slide-inner {
      position: absolute;
      inset: 0;
      transition:
        transform var(--duration) var(--ease),
        filter var(--duration) var(--ease);
      transform: scale(var(--idle-scale));
      filter: blur(var(--idle-blur));
      will-change: transform, filter;
    }

    .slide.active .slide-inner {
      transform: scale(var(--active-scale));
      filter: blur(0px);
    }

    /* Slide image */
    .slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* Vignette + darken for non-active */
    .slide-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%);
      transition: opacity var(--duration) var(--ease);
      opacity: 1;
      z-index: 1;
    }

    .slide.active .slide-vignette {
      opacity: 0.5;
    }

    /* Darken overlay for non-active */
    .slide-darken {
      position: absolute;
      inset: 0;
      background: rgba(8, 8, 16, 0.6);
      transition: opacity var(--duration) var(--ease);
      opacity: 1;
      z-index: 2;
    }

    .slide.active .slide-darken {
      opacity: 0;
    }

    /* ──────────────── CAPTION ──────────────── */
    .slide-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 0 6vw 80px;
      background: linear-gradient(to top,
        rgba(8,8,16,0.88) 0%,
        rgba(8,8,16,0.55) 60%,
        transparent 100%);
      transform: translateY(30px);
      opacity: 0;
      transition:
        transform var(--duration) var(--ease),
        opacity var(--duration) var(--ease);
      pointer-events: none;
    }

    .slide.active .slide-caption {
      transform: translateY(0);
      opacity: 1;
    }

    .caption-year {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(72px, 12vw, 140px);
      font-weight: 300;
      line-height: 0.85;
      color: var(--cream);
      opacity: 0.18;
      letter-spacing: -0.02em;
      display: block;
      pointer-events: none;
    }

    .caption-role {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(13px, 1.8vw, 18px);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--white);
      margin-top: 6px;
      display: block;
    }

    .caption-company {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(11px, 1.3vw, 14px);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(245,240,232,0.55);
      margin-top: 5px;
      display: block;
    }

    .caption-divider {
      display: block;
      width: 36px;
      height: 1px;
      background: rgba(245,240,232,0.4);
      margin: 14px 0 12px;
    }

    /* ──────────────── TIMELINE ──────────────── */
    .timeline {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0;
      z-index: 150;
    }

    .timeline-connector {
      width: 48px;
      height: 1px;
      background: rgba(245,240,232,0.2);
      transition: background 0.4s ease;
      position: relative;
    }

    .timeline-connector.passed {
      background: rgba(245,240,232,0.55);
    }

    .timeline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(245,240,232,0.25);
      border: 1px solid rgba(245,240,232,0.3);
      cursor: pointer;
      position: relative;
      transition:
        background 0.4s ease,
        border-color 0.4s ease,
        transform 0.4s ease;
      flex-shrink: 0;
    }

    .timeline-dot:hover {
      background: rgba(245,240,232,0.5);
      transform: scale(1.3);
    }

    .timeline-dot.active {
      background: var(--cream);
      border-color: var(--cream);
      box-shadow: 0 0 0 3px rgba(245,240,232,0.2);
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(245,240,232,0.2); }
      50%       { box-shadow: 0 0 0 7px rgba(245,240,232,0.07); }
    }

    .timeline-label {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: rgba(245,240,232,0.0);
      white-space: nowrap;
      transition: color 0.3s ease;
      pointer-events: none;
    }

    .timeline-dot.active .timeline-label,
    .timeline-dot:hover .timeline-label {
      color: rgba(245,240,232,0.6);
    }

    /* ──────────────── NAV ARROWS ──────────────── */
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 150;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.3s ease, transform 0.3s ease;
      background: none;
      border: none;
      padding: 0;
    }

    .nav-arrow:hover {
      opacity: 0.9;
    }

    .nav-arrow:hover svg {
      transform: scale(1.15);
    }

    .nav-arrow svg {
      transition: transform 0.25s ease;
    }

    .nav-arrow.prev { left: 24px; }
    .nav-arrow.next { right: 24px; }

    .nav-arrow.disabled {
      opacity: 0.1;
      pointer-events: none;
    }

    /* ──────────────── SLIDE COUNT INDICATOR ──────────────── */
    .slide-counter {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 150;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: rgba(245,240,232,0.4);
    }

    .slide-counter .current {
      font-size: 18px;
      color: rgba(245,240,232,0.7);
      font-weight: 400;
    }

    /* ──────────────── SPROCKET HOLES (DECORATIVE) ──────────────── */
    .sprocket-strip {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .sprocket-strip.top    { top: 6px; }
    .sprocket-strip.bottom { bottom: 6px; }

    .sprocket-holes {
      display: flex;
      gap: 18px;
      padding: 0 12px;
      flex-wrap: nowrap;
      overflow: hidden;
      width: 100%;
      justify-content: space-evenly;
    }

    .sprocket-hole {
      width: 14px;
      height: 9px;
      border-radius: 2px;
      border: 1px solid rgba(245,240,232,0.07);
      background: rgba(245,240,232,0.025);
      flex-shrink: 0;
    }

    /* ──────────────── TOUCH DRAG HINT ──────────────── */
    .drag-hint {
      position: fixed;
      bottom: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(245,240,232,0.25);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: hintFade 4s ease 1.5s forwards;
      opacity: 0;
    }

    @keyframes hintFade {
      0%   { opacity: 0; transform: translateX(-50%) translateY(4px); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .hint-arrow {
      display: inline-block;
      animation: hintArrow 1.2s ease-in-out infinite;
    }

    @keyframes hintArrow {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(4px); }
    }

    /* ──────────────── ENTRANCE ANIMATION ──────────────── */
    .filmstrip-viewport {
      animation: entranceFade 1.2s ease both;
    }

    @keyframes entranceFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- SVG Film Grain Filter -->
  <svg class="grain-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.72 0.65"
          numOctaves="4"
          stitchTiles="stitch"
          result="noiseOut"
        />
        <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise" />
        <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" />
      </filter>
    </defs>
  </svg>

  <!-- Grain Overlay (uses a small tiled canvas for animation) -->
  <canvas class="grain-overlay" id="grainCanvas"></canvas>

  <!-- Progress Bar -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- Sprocket holes – top -->
  <div class="sprocket-strip top">
    <div class="sprocket-holes" id="sprocTop"></div>
  </div>

  <!-- Sprocket holes – bottom -->
  <div class="sprocket-strip bottom">
    <div class="sprocket-holes" id="sprocBot"></div>
  </div>

  <!-- Filmstrip -->
  <div class="filmstrip-viewport">
    <div class="filmstrip-track" id="track">

      <!-- SLIDE 1 -->
      <div class="slide active" data-index="0">
        <div class="slide-inner">
          <img class="slide-img" src="assets/images/1.png" alt="2010 – Automation System Engineer" draggable="false" />
          <div class="slide-vignette"></div>
          <div class="slide-darken"></div>
          <div class="slide-caption">
            <span class="caption-year">2010</span>
            <span class="caption-divider"></span>
            <span class="caption-role">Automation System Engineer</span>
            <span class="caption-company">NPF Inkram</span>
          </div>
        </div>
      </div>

      <!-- SLIDE 2 -->
      <div class="slide" data-index="1">
        <div class="slide-inner">
          <img class="slide-img" src="assets/images/2.png" alt="2013 – Chief Technologist" draggable="false" />
          <div class="slide-vignette"></div>
          <div class="slide-darken"></div>
          <div class="slide-caption">
            <span class="caption-year">2013</span>
            <span class="caption-divider"></span>
            <span class="caption-role">Chief Technologist</span>
            <span class="caption-company">Gazprom</span>
          </div>
        </div>
      </div>

      <!-- SLIDE 3 -->
      <div class="slide" data-index="2">
        <div class="slide-inner">
          <img class="slide-img" src="assets/images/3.png" alt="2019 – Gas Engineer" draggable="false" />
          <div class="slide-vignette"></div>
          <div class="slide-darken"></div>
          <div class="slide-caption">
            <span class="caption-year">2019</span>
            <span class="caption-divider"></span>
            <span class="caption-role">Gas Engineer</span>
            <span class="caption-company">Nord Stream 2</span>
          </div>
        </div>
      </div>

      <!-- SLIDE 4 -->
      <div class="slide" data-index="3">
        <div class="slide-inner">
          <img class="slide-img" src="assets/images/4.png" alt="2022 – Project Manager" draggable="false" />
          <div class="slide-vignette"></div>
          <div class="slide-darken"></div>
          <div class="slide-caption">
            <span class="caption-year">2022</span>
            <span class="caption-divider"></span>
            <span class="caption-role">Project Manager</span>
            <span class="caption-company">Belimed</span>
          </div>
        </div>
      </div>

      <!-- SLIDE 5 -->
      <div class="slide" data-index="4">
        <div class="slide-inner">
          <img class="slide-img" src="assets/images/5.png" alt="2026 – AI & Data Lead" draggable="false" />
          <div class="slide-vignette"></div>
          <div class="slide-darken"></div>
          <div class="slide-caption">
            <span class="caption-year">2026</span>
            <span class="caption-divider"></span>
            <span class="caption-role">AI &amp; Data Lead</span>
            <span class="caption-company">Belimed</span>
          </div>
        </div>
      </div>

    </div><!-- /track -->
  </div><!-- /viewport -->

  <!-- Nav Arrows -->
  <button class="nav-arrow prev disabled" id="navPrev" aria-label="Previous slide">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M17 6L9 14L17 22" stroke="rgba(245,240,232,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button class="nav-arrow next" id="navNext" aria-label="Next slide">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11 6L19 14L11 22" stroke="rgba(245,240,232,0.9)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Slide Counter -->
  <div class="slide-counter">
    <span class="current" id="counterCurrent">01</span>
    <span style="margin: 0 4px; opacity:0.4;">/</span>
    <span>05</span>
  </div>

  <!-- Timeline -->
  <nav class="timeline" id="timeline" aria-label="Slide navigation">
    <!-- Built by JS -->
  </nav>

  <!-- Drag Hint -->
  <div class="drag-hint">
    <span>swipe</span>
    <span class="hint-arrow">→</span>
  </div>

  <script>
  (() => {
    'use strict';

    /* ─── CONFIG ─── */
    const TOTAL       = 5;
    const DURATION_MS = 800;
    const AUTO_MS     = 6000;

    const LABELS = ['2010', '2013', '2019', '2022', '2026'];

    /* ─── STATE ─── */
    let current   = 0;
    let isAnimating = false;
    let autoTimer  = null;
    let progressRaf = null;
    let progressStart = null;

    /* ─── ELEMENTS ─── */
    const track       = document.getElementById('track');
    const slides      = Array.from(document.querySelectorAll('.slide'));
    const navPrev     = document.getElementById('navPrev');
    const navNext     = document.getElementById('navNext');
    const progressBar = document.getElementById('progressBar');
    const timeline    = document.getElementById('timeline');
    const counterEl   = document.getElementById('counterCurrent');

    /* ─── SPROCKET HOLES ─── */
    function buildSprockets() {
      const count = Math.ceil(window.innerWidth / 32);
      ['sprocTop', 'sprocBot'].forEach(id => {
        const el = document.getElementById(id);
        el.innerHTML = Array.from({length: count}, () => '<div class="sprocket-hole"></div>').join('');
      });
    }
    buildSprockets();
    window.addEventListener('resize', buildSprockets);

    /* ─── TIMELINE BUILD ─── */
    function buildTimeline() {
      timeline.innerHTML = '';
      slides.forEach((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'timeline-dot' + (i === 0 ? ' active' : '');
        dot.setAttribute('role', 'button');
        dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
        dot.setAttribute('tabindex', '0');

        const label = document.createElement('span');
        label.className = 'timeline-label';
        label.textContent = LABELS[i];
        dot.appendChild(label);

        dot.addEventListener('click', () => goTo(i));
        dot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') goTo(i); });

        timeline.appendChild(dot);

        if (i < TOTAL - 1) {
          const conn = document.createElement('div');
          conn.className = 'timeline-connector';
          conn.setAttribute('data-after', i);
          timeline.appendChild(conn);
        }
      });
    }
    buildTimeline();

    /* ─── GOTO ─── */
    function goTo(index, fromAuto = false) {
      if (index === current || isAnimating) return;
      if (index < 0 || index >= TOTAL) return;

      isAnimating = true;

      // Update track position
      track.style.transform = `translateX(-${index * 100}vw)`;

      // Update slide classes
      slides[current].classList.remove('active');
      slides[index].classList.add('active');

      const prev = current;
      current = index;

      // Update timeline dots & connectors
      const dots  = timeline.querySelectorAll('.timeline-dot');
      const conns = timeline.querySelectorAll('.timeline-connector');

      dots.forEach((d, i) => {
        d.classList.toggle('active', i === current);
      });
      conns.forEach((c, i) => {
        c.classList.toggle('passed', i < current);
      });

      // Update counter
      counterEl.textContent = String(current + 1).padStart(2, '0');

      // Nav arrows
      navPrev.classList.toggle('disabled', current === 0);
      navNext.classList.toggle('disabled', current === TOTAL - 1);

      // Lock for transition duration
      setTimeout(() => { isAnimating = false; }, DURATION_MS);

      // Restart auto
      if (!fromAuto) restartAuto();
    }

    /* ─── AUTO-ADVANCE ─── */
    function startProgress() {
      stopProgress();
      progressStart = performance.now();
      function tick(now) {
        const elapsed = now - progressStart;
        const pct = Math.min(elapsed / AUTO_MS * 100, 100);
        progressBar.style.width = pct + '%';
        progressBar.style.transitionDuration = '0ms';
        if (pct < 100) {
          progressRaf = requestAnimationFrame(tick);
        }
      }
      progressRaf = requestAnimationFrame(tick);
    }

    function stopProgress() {
      if (progressRaf) cancelAnimationFrame(progressRaf);
      progressRaf = null;
      progressBar.style.width = '0%';
    }

    function restartAuto() {
      clearTimeout(autoTimer);
      stopProgress();
      startProgress();
      autoTimer = setTimeout(() => {
        const next = (current + 1) % TOTAL;
        if (next === 0) {
          // wrap: go back to 0 but treat specially
          goTo(0, true);
        } else {
          goTo(next, true);
        }
        // after wrap back to 0, still restart
        setTimeout(restartAuto, 50);
      }, AUTO_MS);
    }

    // Override goTo to handle auto restart cleanly
    const _goTo = goTo;

    /* ─── NAV BUTTONS ─── */
    navPrev.addEventListener('click', () => goTo(current - 1));
    navNext.addEventListener('click', () => goTo(current + 1));

    /* ─── KEYBOARD ─── */
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });

    /* ─── TOUCH / SWIPE ─── */
    let touchStartX = null;
    let touchStartY = null;
    let isDragging  = false;

    document.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isDragging  = false;
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (touchStartX === null) return;
      const dx = Math.abs(e.touches[0].clientX - touchStartX);
      const dy = Math.abs(e.touches[0].clientY - touchStartY);
      if (dx > dy && dx > 8) isDragging = true;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      if (!isDragging || touchStartX === null) { touchStartX = null; return; }
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 45) {
        if (dx < 0) goTo(current + 1);
        else         goTo(current - 1);
      }
      touchStartX = null;
      isDragging  = false;
    }, { passive: true });

    /* ─── MOUSE DRAG (desktop) ─── */
    let mouseStartX = null;
    let mouseDown   = false;

    document.addEventListener('mousedown', e => {
      mouseStartX = e.clientX;
      mouseDown   = true;
    });

    document.addEventListener('mouseup', e => {
      if (!mouseDown || mouseStartX === null) return;
      const dx = e.clientX - mouseStartX;
      if (Math.abs(dx) > 60) {
        if (dx < 0) goTo(current + 1);
        else         goTo(current - 1);
      }
      mouseDown   = false;
      mouseStartX = null;
    });

    document.addEventListener('mousemove', e => {
      if (mouseDown && Math.abs(e.clientX - mouseStartX) > 5) {
        e.preventDefault();
      }
    });

    /* ─── GRAIN CANVAS (animated) ─── */
    (function initGrain() {
      const canvas = document.getElementById('grainCanvas');
      const ctx    = canvas.getContext('2d');
      let w, h;

      function resize() {
        w = canvas.width  = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      function drawGrain() {
        const imageData = ctx.createImageData(w, h);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          data[i]     = v;
          data[i + 1] = v;
          data[i + 2] = v;
          data[i + 3] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
      }

      let lastFrame = 0;
      const GRAIN_FPS = 12; // low fps = more authentic film grain
      function loop(ts) {
        if (ts - lastFrame > 1000 / GRAIN_FPS) {
          drawGrain();
          lastFrame = ts;
        }
        requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(loop);

      // Set canvas style
      canvas.style.position  = 'fixed';
      canvas.style.inset     = '0';
      canvas.style.width     = '100%';
      canvas.style.height    = '100%';
      canvas.style.opacity   = '0.04';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex    = '100';
      canvas.style.mixBlendMode = 'overlay';
    })();

    /* ─── INIT ─── */
    // Set initial track position
    track.style.transition = 'none';
    track.style.transform  = 'translateX(0)';
    setTimeout(() => {
      track.style.transition = `transform ${DURATION_MS}ms cubic-bezier(0.77, 0, 0.175, 1)`;
    }, 50);

    navPrev.classList.add('disabled');
    restartAuto();

  })();
  </script>
</body>
