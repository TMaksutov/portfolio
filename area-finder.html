<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Coordinate Finder</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0f172a;
        color: #e2e8f0;
        font-family: 'Segoe UI', 'Inter', sans-serif;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
    }

    #container {
        position: relative;
        width: 100vw;
        height: 100vh;
    }

    /* Grid lines for reference */
    #container::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 10% 10%;
        pointer-events: none;
        z-index: 0;
    }

    /* Each bounding area */
    .area {
        position: absolute;
        border: 3px dashed;
        z-index: 10;
    }
    .area.left-area {
        border-color: #22d3ee;
        background: rgba(34, 211, 238, 0.12);
    }
    .area.right-area {
        border-color: #f472b6;
        background: rgba(244, 114, 182, 0.12);
    }

    /* Corner handles */
    .handle {
        position: absolute;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        z-index: 20;
        cursor: grab;
        border: 3px solid white;
        transform: translate(-50%, -50%);
        transition: box-shadow 0.2s;
    }
    .handle:hover { transform: translate(-50%, -50%) scale(1.3); }
    .handle:active { cursor: grabbing; }
    .handle.left-handle { background: #22d3ee; box-shadow: 0 0 18px #22d3ee; }
    .handle.right-handle { background: #f472b6; box-shadow: 0 0 18px #f472b6; }

    /* Coordinate label per handle */
    .handle-label {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.9);
        color: #e2e8f0;
        font-size: 12px;
        font-family: 'Consolas', 'Courier New', monospace;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        white-space: nowrap;
        pointer-events: none;
    }

    /* Area labels */
    .area-label {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 22px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 4px;
        pointer-events: none;
        opacity: 0.4;
    }
    .area.left-area .area-label { color: #22d3ee; }
    .area.right-area .area-label { color: #f472b6; }

    /* Results panel */
    .results {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.97);
        border: 2px solid rgba(99, 102, 241, 0.5);
        border-radius: 14px;
        padding: 18px 32px;
        z-index: 100;
        display: flex;
        gap: 50px;
        align-items: flex-start;
        box-shadow: 0 15px 50px rgba(0,0,0,0.7);
    }

    .result-group h3 {
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }
    .result-group.left h3 { color: #22d3ee; }
    .result-group.right h3 { color: #f472b6; }

    .result-group pre {
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 14px;
        font-weight: 700;
        color: #f1f5f9;
        background: rgba(0,0,0,0.4);
        padding: 10px 14px;
        border-radius: 8px;
        line-height: 1.6;
        user-select: all;
        -webkit-user-select: all;
        cursor: text;
    }

    .instructions {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.95);
        border: 2px solid rgba(99, 102, 241, 0.4);
        padding: 12px 28px;
        border-radius: 10px;
        font-size: 15px;
        color: #94a3b8;
        z-index: 100;
        text-align: center;
    }
    .instructions strong { color: #fff; }
    .instructions span.cyan { color: #22d3ee; font-weight: 700; }
    .instructions span.pink { color: #f472b6; font-weight: 700; }
</style>
</head>
<body>

<div id="container">
    <!-- LEFT AREA box -->
    <div class="area left-area" id="left-area">
        <div class="area-label">LEFT PANEL ZONE</div>
    </div>

    <!-- RIGHT AREA box -->
    <div class="area right-area" id="right-area">
        <div class="area-label">RIGHT PANEL ZONE</div>
    </div>

    <!-- 2 handles for LEFT area -->
    <div class="handle left-handle" id="left-tl" data-area="left" data-corner="tl"><div class="handle-label">--</div></div>
    <div class="handle left-handle" id="left-br" data-area="left" data-corner="br"><div class="handle-label">--</div></div>

    <!-- 2 handles for RIGHT area -->
    <div class="handle right-handle" id="right-tl" data-area="right" data-corner="tl"><div class="handle-label">--</div></div>
    <div class="handle right-handle" id="right-br" data-area="right" data-corner="br"><div class="handle-label">--</div></div>
</div>

<div class="instructions">
    Drag the <span class="cyan">● CYAN</span> handles to set the LEFT panel zone &nbsp;|&nbsp;
    Drag the <span class="pink">● PINK</span> handles to set the RIGHT panel zone &nbsp;|&nbsp;
    <strong>Copy coordinates from below</strong>
</div>

<div class="results">
    <div class="result-group left">
        <h3>● Left Area</h3>
        <pre id="left-result">loading...</pre>
    </div>
    <div class="result-group right">
        <h3>● Right Area</h3>
        <pre id="right-result">loading...</pre>
    </div>
</div>

<script>
// Initial positions in percentage
var areas = {
    left:  { x1: 3,  y1: 10, x2: 48, y2: 85 },
    right: { x1: 50, y1: 10, x2: 97, y2: 85 }
};

var container = document.getElementById('container');
var leftArea  = document.getElementById('left-area');
var rightArea = document.getElementById('right-area');
var leftTL  = document.getElementById('left-tl');
var leftBR  = document.getElementById('left-br');
var rightTL = document.getElementById('right-tl');
var rightBR = document.getElementById('right-br');
var leftResult  = document.getElementById('left-result');
var rightResult = document.getElementById('right-result');

function updateVisuals() {
    var cw = container.clientWidth;
    var ch = container.clientHeight;

    // Left area
    var lx1 = areas.left.x1 / 100 * cw;
    var ly1 = areas.left.y1 / 100 * ch;
    var lx2 = areas.left.x2 / 100 * cw;
    var ly2 = areas.left.y2 / 100 * ch;

    leftArea.style.left   = lx1 + 'px';
    leftArea.style.top    = ly1 + 'px';
    leftArea.style.width  = (lx2 - lx1) + 'px';
    leftArea.style.height = (ly2 - ly1) + 'px';

    leftTL.style.left = lx1 + 'px';
    leftTL.style.top  = ly1 + 'px';
    leftBR.style.left = lx2 + 'px';
    leftBR.style.top  = ly2 + 'px';

    leftTL.querySelector('.handle-label').textContent = areas.left.x1.toFixed(1) + '%, ' + areas.left.y1.toFixed(1) + '%';
    leftBR.querySelector('.handle-label').textContent = areas.left.x2.toFixed(1) + '%, ' + areas.left.y2.toFixed(1) + '%';

    // Right area
    var rx1 = areas.right.x1 / 100 * cw;
    var ry1 = areas.right.y1 / 100 * ch;
    var rx2 = areas.right.x2 / 100 * cw;
    var ry2 = areas.right.y2 / 100 * ch;

    rightArea.style.left   = rx1 + 'px';
    rightArea.style.top    = ry1 + 'px';
    rightArea.style.width  = (rx2 - rx1) + 'px';
    rightArea.style.height = (ry2 - ry1) + 'px';

    rightTL.style.left = rx1 + 'px';
    rightTL.style.top  = ry1 + 'px';
    rightBR.style.left = rx2 + 'px';
    rightBR.style.top  = ry2 + 'px';

    rightTL.querySelector('.handle-label').textContent = areas.right.x1.toFixed(1) + '%, ' + areas.right.y1.toFixed(1) + '%';
    rightBR.querySelector('.handle-label').textContent = areas.right.x2.toFixed(1) + '%, ' + areas.right.y2.toFixed(1) + '%';

    // Update result text
    leftResult.textContent =
        'Top-Left:     ' + areas.left.x1.toFixed(1) + '%,  ' + areas.left.y1.toFixed(1) + '%\n' +
        'Bottom-Right: ' + areas.left.x2.toFixed(1) + '%,  ' + areas.left.y2.toFixed(1) + '%';

    rightResult.textContent =
        'Top-Left:     ' + areas.right.x1.toFixed(1) + '%,  ' + areas.right.y1.toFixed(1) + '%\n' +
        'Bottom-Right: ' + areas.right.x2.toFixed(1) + '%,  ' + areas.right.y2.toFixed(1) + '%';
}

// Drag logic
var dragging = null;

document.addEventListener('mousedown', function(e) {
    var el = e.target;
    if (!el.classList.contains('handle')) {
        el = el.parentElement;
    }
    if (el && el.classList.contains('handle')) {
        dragging = {
            el: el,
            area: el.getAttribute('data-area'),
            corner: el.getAttribute('data-corner')
        };
        e.preventDefault();
    }
});

document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var rect = container.getBoundingClientRect();
    var xPct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    var yPct = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));

    var area = areas[dragging.area];

    if (dragging.corner === 'tl') {
        area.x1 = Math.min(xPct, area.x2 - 3);
        area.y1 = Math.min(yPct, area.y2 - 3);
    } else {
        area.x2 = Math.max(xPct, area.x1 + 3);
        area.y2 = Math.max(yPct, area.y1 + 3);
    }

    updateVisuals();
});

document.addEventListener('mouseup', function() {
    dragging = null;
});

window.addEventListener('resize', updateVisuals);

// Initial render
updateVisuals();
</script>

</body>
</html>
